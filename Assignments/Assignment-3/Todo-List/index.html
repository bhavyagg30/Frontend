<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>My To-Do List</h1>
    <form id="taskForm">
      <input id="taskInput" type="text" placeholder="Enter a task" aria-label="New task">
      <button type="submit">Add</button>
    </form>
    <ul id="taskList"></ul>
    <p id="message" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
